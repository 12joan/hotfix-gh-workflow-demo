name: 'Demo CI'

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 'Run demo tests'
        run: echo "Testing..." && sleep 25 && echo "Done"

  deploy:
    if: ${{ github.ref == 'main' }}
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      queue: ${{ contains(github.event.head_commit.message, '[Hotfix]') && 'single' || 'max' }}
      cancel-in-progress:  ${{ contains(github.event.head_commit.message, '[Hotfix]') }}
    steps:
      - name: 'Deploying'
        run: echo "Deploying..." && sleep 45 && echo "Done"
